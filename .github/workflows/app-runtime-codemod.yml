name: Apply guarded G1 runtime refactor

on:
  push:
    branches:
      - fix/unified-connection-runtime
    paths:
      - .github/refactor-requests/app-runtime-v1.txt

permissions:
  contents: write

jobs:
  apply_runtime_refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unified-connection-runtime
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Apply guarded codemod
        run: node scripts/apply-app-runtime-refactor.js

      - name: Validate patch whitespace
        run: git diff --check

      - name: Commit generated runtime refactor
        run: |
          if git diff --quiet -- src/App.js src/webrtc/signaling.js index.js; then
            echo "No runtime changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.js src/webrtc/signaling.js index.js
          git commit -m "refactor: separate UI lifecycle from connection runtime"
          git push origin HEAD:fix/unified-connection-runtime
