name: Phase 6b-b App patch

on:
  push:
    branches:
      - 'phase6b-b/outbound-p2p-coordinator'
    paths:
      - '.github/workflows/phase6bb-app-patch.yml'

permissions:
  contents: write

jobs:
  patch-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6b-b/outbound-p2p-coordinator
          fetch-depth: 0

      - name: Apply exact App ownership patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/App.js')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "import { connectionCoordinator } from './network/ConnectionCoordinator';\nimport { resolveKnownLanTarget } from './network/knownLanTarget';",
              "import { connectionCoordinator } from './network/ConnectionCoordinator';\nimport { connectP2pFromApp, resolveStableP2pDeviceId } from './network/p2pAppBridge';\nimport { resolveKnownLanTarget } from './network/knownLanTarget';",
              'p2pAppBridge import',
          )

          replace_once(
              "  const pendingKnownLanPeerIdRef = useRef(null);\n  const connectionAddressTrackerRef = useRef(createConnectionAddressTracker());",
              "  const pendingKnownLanPeerIdRef = useRef(null);\n  const coordinatorP2pAttemptRef = useRef(null);\n  const connectionAddressTrackerRef = useRef(createConnectionAddressTracker());",
              'coordinator P2P attempt ref',
          )

          replace_once(
              "  const handlePeerConnected = async initialInfo => {\n    if (!initialInfo?.groupFormed || disconnectingRef.current) return;\n    if (stateRef.current === States.CONNECTED || connectionSetupRef.current) return;",
              "  const handlePeerConnected = async initialInfo => {\n    if (!initialInfo?.groupFormed || disconnectingRef.current) return;\n    const coordinatorStatus = connectionCoordinator.getCoordinatorStatus();\n    if (\n      coordinatorStatus.transport === TRANSPORTS.P2P &&\n      (coordinatorStatus.state === 'CONNECTING' || coordinatorStatus.state === 'CONNECTED')\n    ) {\n      // The adapter/coordinator owns this group event. App must not open a\n      // second signaling path for the same Wi-Fi Direct route.\n      return;\n    }\n    if (stateRef.current === States.CONNECTED || connectionSetupRef.current) return;",
              'legacy PEER_CONNECTED gate',
          )

          replace_once(
              "      finishWifiDisconnect({ unexpected: true });",
              "      if (activeControlOwnerRef.current === CONTROL_PLANE_OWNERS.COORDINATOR) {\n        finishCurrentTransportDisconnect({ unexpected: true }).catch(error => {\n          console.warn('[App] coordinator P2P disconnect cleanup failed:', error?.message || error);\n        });\n      } else {\n        finishWifiDisconnect({ unexpected: true });\n      }",
              'coordinator native disconnect gate',
          )

          replace_once(
              "  const finishLogicalDisconnect = async ({\n    remote = false,\n    unexpected = false,\n    disconnectViaCoordinator = false,\n  } = {}) => {",
              "  const waitForCoordinatorP2pCleanup = async (timeoutMs = 10000) => {\n    const deadline = Date.now() + timeoutMs;\n    while (Date.now() < deadline) {\n      const p2p = connectionCoordinator.getCoordinatorStatus()?.p2p;\n      if (!p2p || (\n        p2p.state === 'IDLE' &&\n        !p2p.activeRoute &&\n        !p2p.pendingPeerId\n      )) {\n        return true;\n      }\n      if (p2p.state === 'ERROR') return false;\n      await delay(250);\n    }\n    return false;\n  };\n\n  const finishLogicalDisconnect = async ({\n    remote = false,\n    unexpected = false,\n    disconnectViaCoordinator = false,\n  } = {}) => {",
              'coordinator cleanup waiter',
          )

          replace_once(
              "    cleanupSessionResources({ disconnectViaCoordinator });\n\n    if (mountedRef.current) {",
              "    const coordinatorOwnsP2p =\n      disconnectViaCoordinator && activeTransportRef.current === TRANSPORTS.P2P;\n    cleanupSessionResources({ disconnectViaCoordinator });\n\n    if (coordinatorOwnsP2p) {\n      const clean = await waitForCoordinatorP2pCleanup(10000);\n      if (!clean) {\n        if (mountedRef.current) {\n          stateRef.current = States.ERROR;\n          setState(States.ERROR);\n          setStatusText('لم يؤكد منسق الاتصال تنظيف مسار Wi-Fi Direct خلال المهلة.');\n        }\n        disconnectingRef.current = false;\n        return false;\n      }\n    }\n\n    if (mountedRef.current) {",
              'await coordinator P2P cleanup',
          )

          replace_once(
              "    if (plan.cleanupWifiDirect) {\n      return finishWifiDisconnect({ remote, unexpected });\n    }",
              "    if (plan.cleanupWifiDirect && !plan.disconnectViaCoordinator) {\n      return finishWifiDisconnect({ remote, unexpected });\n    }",
              'route coordinator P2P teardown through coordinator',
          )

          old_begin = """  const beginWifiNegotiation = async (selected, { incoming = false } = {}) => {
    connectionAddressTrackerRef.current.beginAttempt();
    targetPeerRef.current = selected;
    connectionSetupRef.current = false;
    const attemptId = ++connectionAttemptRef.current;

    // لا نعرض رسائل الجلسة السابقة أثناء انتظار وصول هوية الجهاز الجديد.
    setMessages([]);
    if (timeoutRef.current) {
      clearTimeout(timeoutRef.current);
    }
    stateRef.current = States.WIFI_CONNECTING;
    setState(States.WIFI_CONNECTING);
    connectionPhaseRef.current = incoming
      ? 'الاستجابة لدعوة Wi-Fi Direct'
      : 'بدء تفاوض Wi-Fi Direct';
    setStatusText(
      incoming
        ? `وصل طلب اتصال من ${selected.customName || selected.name || 'الجهاز'} — جاري إكماله…`
        : `جاري الاتصال بـ ${selected.customName || selected.name || 'الجهاز'}…`
    );

    await DirectConnection.stopServiceDiscovery().catch(() => false);
    // لا نستدعي stopPeerDiscovery هنا: أندرويد يمسح معه قائمة الأقران
    // الداخلية. العنوان مأخوذ من requestPeers أو من دعوة INVITED الحالية.
    await DirectConnection.connectToPeer(selected.deviceAddress);

    clearTimeout(timeoutRef.current);
    timeoutRef.current = setTimeout(async () => {
      if (!mountedRef.current || attemptId !== connectionAttemptRef.current) {
        return;
      }
      if (stateRef.current === States.WIFI_CONNECTING) {
        await recoverFailedConnection(
          'تفاوض Wi-Fi Direct',
          new Error('لم تتكوّن المجموعة خلال 30 ثانية ولم يستجب الجهاز')
        );
      }
    }, 30000);
  };
"""

          new_begin = """  const beginWifiNegotiation = async (selected, { incoming = false } = {}) => {
    const stableDeviceId = incoming ? null : resolveStableP2pDeviceId(selected, selected);
    if (stableDeviceId) {
      connectionAddressTrackerRef.current.beginAttempt();
      targetPeerRef.current = selected;
      connectionSetupRef.current = false;
      const attemptId = ++connectionAttemptRef.current;
      coordinatorP2pAttemptRef.current = { attemptId, deviceId: stableDeviceId };
      setMessages([]);
      if (timeoutRef.current) {
        clearTimeout(timeoutRef.current);
        timeoutRef.current = null;
      }

      connectionPhaseRef.current = 'اتصال Wi-Fi Direct عبر المنسق';
      if (mountedRef.current) {
        setStatusText(`جاري الاتصال بـ ${selected.customName || selected.name || 'الجهاز'} عبر Wi-Fi Direct…`);
      }

      try {
        const identity = identityRef.current || await getDeviceIdentity().catch(() => null);
        if (!identity?.deviceId) throw new Error('تعذّر تحميل هوية G1 الثابتة');
        identityRef.current = identity;
        connectionCoordinator.setIdentity(identity);

        const result = await connectP2pFromApp({
          contact: selected,
          discoveredPeer: selected,
          timeoutMs: 30000,
        });

        if (
          !mountedRef.current ||
          disconnectingRef.current ||
          attemptId !== connectionAttemptRef.current
        ) {
          connectionCoordinator.disconnect();
          return false;
        }

        const route = result.route || {};
        if (route.connectionEpoch != null) {
          connectionAddressTrackerRef.current.activateConnection(route.connectionEpoch);
        }

        const peer = result.peer;
        const displayName = result.displayName || selected.customName || selected.name || peer.deviceName || 'الجهاز الآخر';
        await savePeer(peer.deviceId, peer.deviceName || displayName, '');
        await savePeerAddress(peer.deviceId, selected.deviceAddress, peer.deviceName || displayName);
        const history = await loadMessages(peer.deviceId, 300);

        peerIdRef.current = peer.deviceId;
        peerIpRef.current = route.isGroupOwner ? null : (route.groupOwnerAddress || null);
        lastConnectionRef.current = null;
        activeTransportRef.current = TRANSPORTS.P2P;
        activeControlOwnerRef.current = CONTROL_PLANE_OWNERS.COORDINATOR;
        reconnectAttemptRef.current = 0;
        targetPeerRef.current = {
          ...selected,
          deviceId: peer.deviceId,
          peerId: peer.deviceId,
          name: displayName,
        };

        setActivePeerInfo({
          ...selected,
          deviceId: peer.deviceId,
          peerId: peer.deviceId,
          name: displayName,
          transport: 'p2p',
        });
        setPeerDisplayName(displayName);
        startTransferServer().catch(() => {});
        ensureMicGuard();
        startConnectionService('متصل عبر واي فاي مباشر');
        const normalizedHistory = (history || []).map(item => ({ ...item, time: Number(item.time) }));
        setMessages(prev => mergePeerMessageHistory(normalizedHistory, prev));

        connectionPhaseRef.current = 'متصل';
        stateRef.current = States.CONNECTED;
        setState(States.CONNECTED);
        setActiveTier(Tiers.WIFI_DIRECT);
        setStatusText('');
        setChatOpen(true);
        refreshContacts();
        return true;
      } catch (error) {
        console.warn('[App] coordinator P2P connect failed:', error?.message || error);
        const coordinatorStatus = connectionCoordinator.getCoordinatorStatus();
        if (
          coordinatorStatus.transport === TRANSPORTS.P2P &&
          coordinatorStatus.peer?.deviceId === stableDeviceId &&
          coordinatorStatus.state !== 'IDLE'
        ) {
          connectionCoordinator.disconnect();
        }
        if (
          mountedRef.current &&
          !disconnectingRef.current &&
          attemptId === connectionAttemptRef.current
        ) {
          activeTransportRef.current = null;
          activeControlOwnerRef.current = null;
          peerIpRef.current = null;
          lastConnectionRef.current = null;
          targetPeerRef.current = null;
          stateRef.current = States.IDLE;
          setState(States.IDLE);
          setActiveTier(Tiers.NONE);
          setStatusText(`فشل اتصال Wi-Fi Direct عبر المنسق: ${error?.message || 'خطأ غير معروف'}`);
        }
        return false;
      } finally {
        if (coordinatorP2pAttemptRef.current?.attemptId === attemptId) {
          coordinatorP2pAttemptRef.current = null;
        }
      }
    }

    // Incoming invitations and peers without a provable stable G1 identity stay
    // on the legacy path for this surgical slice. They migrate separately after
    // outbound coordinator ownership is CI/device verified.
    connectionAddressTrackerRef.current.beginAttempt();
    targetPeerRef.current = selected;
    connectionSetupRef.current = false;
    const attemptId = ++connectionAttemptRef.current;

    // لا نعرض رسائل الجلسة السابقة أثناء انتظار وصول هوية الجهاز الجديد.
    setMessages([]);
    if (timeoutRef.current) {
      clearTimeout(timeoutRef.current);
    }
    stateRef.current = States.WIFI_CONNECTING;
    setState(States.WIFI_CONNECTING);
    connectionPhaseRef.current = incoming
      ? 'الاستجابة لدعوة Wi-Fi Direct'
      : 'بدء تفاوض Wi-Fi Direct';
    setStatusText(
      incoming
        ? `وصل طلب اتصال من ${selected.customName || selected.name || 'الجهاز'} — جاري إكماله…`
        : `جاري الاتصال بـ ${selected.customName || selected.name || 'الجهاز'}…`
    );

    await DirectConnection.stopServiceDiscovery().catch(() => false);
    // لا نستدعي stopPeerDiscovery هنا: أندرويد يمسح معه قائمة الأقران
    // الداخلية. العنوان مأخوذ من requestPeers أو من دعوة INVITED الحالية.
    await DirectConnection.connectToPeer(selected.deviceAddress);

    clearTimeout(timeoutRef.current);
    timeoutRef.current = setTimeout(async () => {
      if (!mountedRef.current || attemptId !== connectionAttemptRef.current) {
        return;
      }
      if (stateRef.current === States.WIFI_CONNECTING) {
        await recoverFailedConnection(
          'تفاوض Wi-Fi Direct',
          new Error('لم تتكوّن المجموعة خلال 30 ثانية ولم يستجب الجهاز')
        );
      }
    }, 30000);
  };
"""
          replace_once(old_begin, new_begin, 'outbound coordinator P2P flow')

          replace_once(
              "    if (stateRef.current === States.DISCONNECTING || disconnectingRef.current) {\n      Alert.alert('جاري إنهاء الاتصال', 'انتظر حتى يكتمل إنهاء الاتصال الحالي.');\n      return;\n    }\n    if (scanningRef.current) return scanPromiseRef.current;",
              "    if (stateRef.current === States.DISCONNECTING || disconnectingRef.current) {\n      Alert.alert('جاري إنهاء الاتصال', 'انتظر حتى يكتمل إنهاء الاتصال الحالي.');\n      return;\n    }\n    if (coordinatorP2pAttemptRef.current) {\n      setStatusText('محاولة اتصال Wi-Fi Direct جارية بالفعل…');\n      return;\n    }\n    if (scanningRef.current) return scanPromiseRef.current;",
              'scan guard during coordinator connect',
          )

          replace_once(
              "    if (stateRef.current === States.DISCONNECTING || disconnectingRef.current) {\n      Alert.alert('جاري إنهاء الاتصال', 'انتظر حتى يكتمل إنهاء الاتصال الحالي.');\n      return;\n    }\n\n    try {\n      const stableId = contact.deviceId || contact.peerId || null;",
              "    if (stateRef.current === States.DISCONNECTING || disconnectingRef.current) {\n      Alert.alert('جاري إنهاء الاتصال', 'انتظر حتى يكتمل إنهاء الاتصال الحالي.');\n      return;\n    }\n    if (coordinatorP2pAttemptRef.current) {\n      setStatusText('محاولة اتصال Wi-Fi Direct جارية بالفعل…');\n      return;\n    }\n\n    try {\n      const stableId = contact.deviceId || contact.peerId || null;",
              'contact connect guard during coordinator connect',
          )

          path.write_text(text)
          PY

      - name: Remove one-shot workflow and commit patch
        shell: bash
        run: |
          rm -f .github/workflows/phase6bb-app-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.js .github/workflows/phase6bb-app-patch.yml
          git diff --cached --check
          git commit -m 'phase6b-b: route outbound P2P through coordinator'
          git push origin HEAD:phase6b-b/outbound-p2p-coordinator
