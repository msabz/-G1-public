name: Phase 6b-b App patch PR trigger

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/phase6bb-app-patch-pr.yml'
      - '.github/workflows/phase6bb-app-patch-v2.yml'

permissions:
  contents: write

jobs:
  patch-app:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6b-b/outbound-p2p-coordinator
          fetch-depth: 0

      - name: Run v2 embedded exact patch
        shell: bash
        run: |
          awk '
            /^          python3 - <<.PY./ { capture=1; next }
            /^          PY$/ { capture=0 }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/phase6bb-app-patch-v2.yml > /tmp/phase6bb_patch.py
          test -s /tmp/phase6bb_patch.py
          python3 /tmp/phase6bb_patch.py

      - name: Remove one-shot workflows and commit App migration
        shell: bash
        run: |
          rm -f \
            .github/workflows/phase6bb-app-patch.yml \
            .github/workflows/phase6bb-app-patch-pr.yml \
            .github/workflows/phase6bb-app-patch-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.js .github/workflows/phase6bb-app-patch*.yml
          git diff --cached --check
          git commit -m 'phase6b-b: route outbound P2P through coordinator'
          git push origin HEAD:phase6b-b/outbound-p2p-coordinator
