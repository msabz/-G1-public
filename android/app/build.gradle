apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 */
def jscFlavor = 'org.webkit:android-jsc:+'

// Distribution/release signing remains protected and is never committed.
def releaseStoreFile = System.getenv("G1_RELEASE_STORE_FILE")
def releaseStorePassword = System.getenv("G1_RELEASE_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("G1_RELEASE_KEY_ALIAS")
def releaseKeyPassword = System.getenv("G1_RELEASE_KEY_PASSWORD")
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

// CI debug artifacts also need signature continuity so testers can install each
// build as an update. The private development key is injected by the workflow
// through a protected repository secret and is never stored in Git.
def ciDebugStoreFile = System.getenv("G1_CI_SIGNING_STORE_FILE")
def hasCiDebugSigning = ciDebugStoreFile && file(ciDebugStoreFile).exists()

// GitHub Actions supplies a monotonically increasing run number. Local builds
// retain versionCode 1 unless the caller explicitly provides G1_VERSION_CODE.
def resolvedVersionCode = 1
try {
    resolvedVersionCode = Math.max(1, Integer.parseInt(System.getenv("G1_VERSION_CODE") ?: "1"))
} catch (ignored) {
    resolvedVersionCode = 1
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.m200"
    defaultConfig {
        applicationId "com.directchat"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolvedVersionCode
        versionName "1.0"
    }

    signingConfigs {
        if (hasCiDebugSigning) {
            ciDebug {
                storeFile file(ciDebugStoreFile)
                storePassword "g1-ci-debug-only"
                keyAlias "g1-ci"
                keyPassword "g1-ci-debug-only"
            }
        }
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            // Local development keeps Android's normal generated debug key.
            // CI injects one stable development-only key so successive APKs
            // can update each other without uninstalling application data.
            if (hasCiDebugSigning) {
                signingConfig signingConfigs.ciDebug
            }
        }
        release {
            // Without protected signing inputs Gradle still builds an unsigned release APK,
            // which is suitable for CI validation. Distribution builds must provide the
            // environment variables above and must never commit their key material.
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("androidx.core:core-ktx:1.13.1")
    testImplementation("junit:junit:4.13.2")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
